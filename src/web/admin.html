<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <title>Maxio · Administración</title>
  <link rel="stylesheet" href="/web/styles.css">
  <style>
    .admin-shell{min-height:100dvh;padding:0 18px 44px;background:linear-gradient(#10203a 0,#09111f 310px)}.admin-header,.admin-content{max-width:1060px;margin:auto}.admin-header{height:72px;display:flex;align-items:center;justify-content:space-between}.admin-header button{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#172740;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.admin-content{display:grid;gap:16px}.admin-hero{padding:24px;border:1px solid #668bb2;border-radius:19px;background:linear-gradient(145deg,#173b5b,#0a1929)}.admin-hero h1{margin:5px 0;font-size:30px}.admin-hero p{margin:0;color:#c0d5e9}.admin-actions,.admin-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.admin-action,.admin-metric{padding:14px;border:1px solid #355b82;border-radius:14px;background:#10243a}.admin-action{color:var(--ink);font:inherit;text-align:left;cursor:pointer}.admin-action.primary{border-color:var(--lime);background:linear-gradient(145deg,#31512a,#18331f)}.admin-action b,.admin-action span,.admin-metric b,.admin-metric span{display:block}.admin-action span,.admin-metric span{margin-top:5px;color:var(--muted);font-size:11px}.admin-metric b{font-size:25px;color:var(--lime)}.admin-dialog{border:1px solid #668bb2;border-radius:18px;background:#10243a;color:var(--ink);width:min(430px,calc(100% - 28px));padding:22px}.admin-dialog::backdrop{background:#020711cf}.admin-dialog form{display:grid;gap:11px}.admin-dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-dialog h2{margin:0}.admin-dialog button{border:0;border-radius:10px;padding:11px;background:var(--lime);color:#18211a;font-weight:900;cursor:pointer}.admin-dialog .secondary{background:#263a54;color:var(--ink)}.admin-dialog small{color:#ff9b82}@media(max-width:550px){.admin-actions,.admin-metrics{grid-template-columns:1fr 1fr}.admin-actions .primary{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header"><div class="brand"><b>M</b> maxio</div><button id="logout" type="button">Cerrar sesión</button></header>
    <section class="admin-content">
      <article class="admin-hero"><p class="eyebrow">ADMINISTRACIÓN GLOBAL</p><h1>Consola Maxio</h1><p>Gestioná jugadores, ligas y partidos sin formar parte de la competencia.</p></article>
      <section><div class="heading"><h2>Acciones</h2><span>GESTIÓN</span></div><div class="admin-actions"><button class="admin-action primary" data-dialog="player"><b>Crear jugador</b><span>Cuenta y perfil deportivo</span></button><button class="admin-action" data-dialog="league"><b>Crear liga</b><span>Nueva competencia</span></button><button class="admin-action" data-dialog="match"><b>Crear partido</b><span>Programar una fecha</span></button></div></section>
      <section><div class="heading"><h2>Estado de la plataforma</h2><span>EN VIVO</span></div><div id="metrics" class="admin-metrics"><article class="admin-metric"><b>…</b><span>Cargando métricas</span></article></div></section>
    </section>
  </main>
  <dialog id="player" class="admin-dialog"><form><h2>Crear jugador</h2><div class="grid"><label>Usuario<input name="username" minlength="3" maxlength="50" required></label><label>Nacionalidad<input name="nationality" value="UY" minlength="2" maxlength="2" required></label></div><div class="grid"><label>Nombre<input name="first_name"></label><label>Apellido<input name="last_name"></label></div><label>Email<input name="email" type="email" required></label><label>Contraseña temporal<input name="password" type="password" minlength="6" required></label><div class="grid"><label>Tiro<input name="tiro" type="number" min="0" max="100" value="50" required></label><label>Ritmo<input name="ritmo" type="number" min="0" max="100" value="50" required></label><label>Físico<input name="fisico" type="number" min="0" max="100" value="50" required></label><label>Defensa<input name="defensa" type="number" min="0" max="100" value="50" required></label><label>Aura<input name="aura" type="number" min="0" max="100" value="50" required></label></div><small></small><button>Crear jugador</button><button class="secondary" type="button" data-close>Cancelar</button></form></dialog>
  <dialog id="league" class="admin-dialog"><form><h2>Crear liga</h2><label>Nombre<input name="name" minlength="3" maxlength="100" required></label><label><input name="is_public" type="checkbox"> Liga pública</label><label><input name="is_special" type="checkbox"> Liga especial</label><label>Máximo de jugadores por grupo (opcional)<input name="max_group_size" type="number" min="2" max="5"></label><small></small><button>Crear liga</button><button class="secondary" type="button" data-close>Cancelar</button></form></dialog>
  <dialog id="match" class="admin-dialog"><form><h2>Crear partido</h2><label>Fecha y hora<input name="date" type="datetime-local" required></label><label>Jugadores máximos<input name="max_players" type="number" min="2" max="30" value="10" required></label><label>ID de liga (opcional)<input name="league_id" type="number" min="1"></label><small></small><button>Crear partido</button><button class="secondary" type="button" data-close>Cancelar</button></form></dialog>
  <script src="/web/admin.js" defer></script>
</body>
</html>
