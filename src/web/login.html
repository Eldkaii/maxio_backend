<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <title>Maxio</title>
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <main>
    <section class="login"><div class="login-card">
      <div class="brand"><b>M</b> maxio</div>
      <p class="eyebrow">TU JUEGO, EN NÚMEROS</p>
      <h1>Todo tu fútbol,<em>en un lugar.</em></h1>
      <p>Ingresá para gestionar tu juego o administrar la plataforma.</p>
      <form id="login-form" novalidate>
        <label>Usuario<input name="username" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <small id="error" aria-live="polite"></small>
        <button type="submit">Ingresar <span>→</span></button>
      </form>
    </div></section>
  </main>
  <script src="/web/login.js" defer></script>
</body>
</html>
